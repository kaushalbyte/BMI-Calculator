<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1 class="title">BMI Calculator</h1>
    <div class="height">
        <h3 class="label">Enter your height in centimeters: </h3>
        <input type="number" id="height" name="height">
    </div>
    <div class="weight">
        <h3 class="label">Enter your weight in kilograms: </h3>
        <input type="number" id="weight" name="weight">
        
    </div>
    <div class="calculate">
        <button >Calculate BMI</button>
    </div>
    <div class="result"></div>
    <div class="guide">
        <h3>BMI Weight Guide</h3>
        <p><strong>Underweight:</strong> BMI less than 18.5</p>
        <p><strong>Normal weight:</strong> BMI 18.5 to 24.9</p>
        <p><strong>Overweight:</strong> BMI 25 to 29.9</p>
        <p><strong>Obesity:</strong> BMI 30 or greater</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
